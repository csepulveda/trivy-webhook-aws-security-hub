name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # ── Job 1: unit tests ────────────────────────────────────────────────────────
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./... -count=1 -v

  # ── Job 2: docker build ──────────────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          provenance: false
          tags: trivy-webhook-aws-security-hub:ci

  # ── Job 3: integration tests ─────────────────────────────────────────────────
  # Runs the webhook binary + mock Security Hub locally inside the runner.
  # No AWS account, no external services — everything is self-contained.
  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v3

      - name: Run integration tests
        run: ./hack/integration-test.sh

  # ── Job 4: E2E in Minikube ───────────────────────────────────────────────────
  # Deploys the webhook and mock Security Hub into a real Kubernetes cluster,
  # creates Trivy CRD objects, sends them to the webhook, and verifies findings.
  e2e-test:
    name: E2E tests (Minikube)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          cpus: 2
          memory: 4096m
          driver: docker

      - name: Run E2E tests
        run: ./hack/minikube-e2e.sh
