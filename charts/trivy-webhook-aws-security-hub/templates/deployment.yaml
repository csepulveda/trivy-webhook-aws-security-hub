apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trivy-webhook-aws-security-hub.fullname" . }}
  labels:
    {{- include "trivy-webhook-aws-security-hub.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "trivy-webhook-aws-security-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "trivy-webhook-aws-security-hub.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trivy-webhook-aws-security-hub.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AWS_REGION
              value: {{ .Values.config.AWS_REGION | quote }}
            - name: INFRA_ASSESSMENT_ENABLE
              value: {{ .Values.config.INFRA_ASSESSMENT_ENABLE | quote }}
            - name: CONFIG_AUDIT_ENABLE
              value: {{ .Values.config.CONFIG_AUDIT_ENABLE | quote }}
            - name: CLUSTER_COMPLIANCE_ENABLE
              value: {{ .Values.config.CLUSTER_COMPLIANCE_ENABLE | quote }}
            - name: VULNERABILITY_ENABLE
              value: {{ .Values.config.VULNERABILITY_ENABLE | quote }}
            - name: INCLUDE_ACCOUNT_ID_IN_FINDING_ID
              value: {{ .Values.config.INCLUDE_ACCOUNT_ID_IN_FINDING_ID | quote }}
            {{ if .Values.extraenvs }}
              {{- toYaml .Values.extraenvs | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
